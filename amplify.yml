version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Gerar .env para o runtime (Lambda não herda env vars do build automaticamente)
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.runtime
        - echo "JWT_SECRET=$JWT_SECRET" >> .env.runtime
        - echo "NODE_ENV=$NODE_ENV" >> .env.runtime
        - echo "VITE_APP_TITLE=$VITE_APP_TITLE" >> .env.runtime
        - echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env.runtime
        - echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env.runtime
        - echo "BUILT_IN_FORGE_API_URL=$BUILT_IN_FORGE_API_URL" >> .env.runtime
        - echo "BUILT_IN_FORGE_API_KEY=$BUILT_IN_FORGE_API_KEY" >> .env.runtime
        - echo "VITE_FRONTEND_FORGE_API_KEY=$VITE_FRONTEND_FORGE_API_KEY" >> .env.runtime
        - echo "VITE_FRONTEND_FORGE_API_URL=$VITE_FRONTEND_FORGE_API_URL" >> .env.runtime
        - echo "VITE_ANALYTICS_ENDPOINT=$VITE_ANALYTICS_ENDPOINT" >> .env.runtime
        - echo "VITE_ANALYTICS_WEBSITE_ID=$VITE_ANALYTICS_WEBSITE_ID" >> .env.runtime
        - echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env.runtime
        - echo "SCHEDULED_SECRET=$SCHEDULED_SECRET" >> .env.runtime
        - echo "[INFO] .env.runtime generated with env vars for Lambda runtime"
        - node scripts/build-amplify.mjs
        - cd .amplify-hosting/compute/default && pnpm install --prod --no-frozen-lockfile
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
