version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    # O Amplify SSR (Node.js) espera os artefatos neste formato
    baseDirectory: /
    files:
      - "dist/**/*"
      - "node_modules/**/*"
      - "package.json"
      - "pnpm-lock.yaml"
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
